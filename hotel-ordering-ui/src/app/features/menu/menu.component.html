<div class="container py-4">

  <div class="text-center mb-4">
    <h1>🍽️ Hotel ABC</h1>
    <p class="text-muted">
      Fresh food. Fast service. Happy customers.
    </p>
  </div>

  <div class="row g-4">

    <div
      class="col-md-6 col-lg-4"
      *ngFor="let item of menuItems">

      <div class="card h-100 shadow-sm">

        <img
          [src]="item.imageUrl"
          [alt]="item.name"
          class="card-img-top food-image">

        <div class="card-body">

          <h5 class="card-title">
            {{ item.name }}
          </h5>

          <p class="text-muted">
            {{ item.description }}
          </p>

          <div class="d-flex justify-content-between align-items-center">

            <strong>
              ₹{{ item.price }}
            </strong>

          <button class="btn btn-primary" (click)="addToCart(item)">
            Add to Cart
          </button>

          </div>

        </div>

      </div>

    </div>

  </div>

</div>
